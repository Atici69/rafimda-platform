<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><title>Rafi Akademi stüdyo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#0b2545;font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif}
#frame{position:absolute;left:0;top:0;width:1280px;height:720px;border:0;background:#f3f5f9}
#fade{position:absolute;inset:0;background:#f3f5f9;opacity:0;pointer-events:none;transition:opacity .25s}
#cursor{position:absolute;left:640px;top:360px;width:30px;height:30px;z-index:50;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));opacity:0;transition:opacity .3s}
#ring{position:absolute;z-index:40;border:3px solid #ff7a00;border-radius:10px;box-shadow:0 0 0 6px rgba(255,122,0,.22),0 0 0 9999px rgba(6,18,36,.16);opacity:0;pointer-events:none;transition:left .45s ease,top .45s ease,width .45s ease,height .45s ease,opacity .3s}
#ring.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 6px rgba(255,122,0,.22),0 0 0 9999px rgba(6,18,36,.16)}50%{box-shadow:0 0 0 11px rgba(255,122,0,.12),0 0 0 9999px rgba(6,18,36,.16)}}
.ripple{position:absolute;z-index:49;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:3px solid #ff7a00;pointer-events:none;animation:rip .55s ease-out forwards}
@keyframes rip{to{transform:scale(3.4);opacity:0}}
#cap{position:absolute;left:50%;bottom:22px;z-index:60;width:980px;margin-left:-490px;display:flex;gap:16px;align-items:center;padding:14px 20px 14px 14px;border-radius:18px;background:rgba(11,37,69,.96);color:#fff;box-shadow:0 12px 32px rgba(0,0,0,.35);opacity:0;transform:translateY(12px);transition:opacity .3s,transform .3s}
#cap.on{opacity:1;transform:none}
#cap img{width:64px;height:64px;flex:0 0 64px;background:#fff;border-radius:50%;padding:5px;border:3px solid #ff7a00}
#cap .t{font-size:21px;line-height:1.38;font-weight:500;min-height:58px;display:flex;align-items:center}
#cap .s{position:absolute;left:96px;top:-14px;background:#ff7a00;color:#fff;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.02em}
#cap .s:empty{display:none}
#title,#end{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;background:radial-gradient(circle at 50% 35%,#163a66 0,#0b2545 60%);opacity:0;pointer-events:none;transition:opacity .45s}
#title.on,#end.on{opacity:1}
#title img,#end img{width:150px;height:150px;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.kick{margin-top:18px;font-size:18px;font-weight:700;letter-spacing:.18em;color:#ff7a00;text-transform:uppercase}
.big{margin-top:10px;font-size:46px;font-weight:800;max-width:1050px;line-height:1.15}
.sub{margin-top:14px;font-size:20px;color:#c9d6ea}
.brand{position:absolute;bottom:28px;font-size:16px;color:#c9d6ea}.brand b{color:#fff}.brand i{color:#ff7a00;font-style:normal}
#chip{position:absolute;right:18px;top:16px;z-index:70;padding:6px 12px;border-radius:999px;background:rgba(11,37,69,.88);color:#fff;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s}
#chip.on{opacity:1}#chip b{color:#ff7a00}
</style></head>
<body>
<iframe id="frame" src="about:blank"></iframe>
<div id="fade"></div>
<div id="ring"></div>
<svg id="cursor" viewBox="0 0 24 24"><path d="M4 2l15 11-6.5 1.2L16 21l-3 1.4-3.4-6.8L4 20z" fill="#fff" stroke="#0b2545" stroke-width="1.6" stroke-linejoin="round"/></svg>
<div id="chip"><b>Rafi Akademi</b> · <span></span></div>
<div id="cap"><span class="s"></span><img src="https://test.local/modules/rafimda-rafi/assets/img/rafi.svg" alt=""><div class="t"></div></div>
<div id="title"><img src="https://test.local/modules/rafimda-rafi/assets/img/rafi.svg" alt=""><div class="kick">Rafi Akademi</div><div class="big"></div><div class="sub"></div><div class="brand"><b>Rafımda</b> · <i>Aradığınız Her Şey, Rafımda!</i></div></div>
<div id="end"><img src="https://test.local/modules/rafimda-rafi/assets/img/rafi.svg" alt=""><div class="big"></div><div class="sub"></div><div class="brand"><b>Rafımda</b> · <i>Aradığınız Her Şey, Rafımda!</i></div></div>
<script>
(function(){
const $=s=>document.querySelector(s), F=$('#frame'), C=$('#cursor'), R=$('#ring'), CAP=$('#cap');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let cx=640, cy=360;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const doc=()=>F.contentDocument, win=()=>F.contentWindow;
function el(sel){
	if(typeof sel!=='string') return sel;
	// "metin=..." ile görünür metinden öğe bul
	const m=sel.match(/^(.*?)::text\((.*?)\)\s*(.*)$/);
	if(m){const list=[...doc().querySelectorAll(m[1]||'*')].filter(e=>e.textContent.includes(m[2])&&e.getClientRects().length>0);
		list.sort((a,b)=>a.textContent.length-b.textContent.length); if(!list[0]) throw new Error('bulunamadı: '+sel);
		if(m[3]){const sub=list[0].querySelector(m[3]); if(!sub) throw new Error('bulunamadı: '+sel); return sub;} return list[0];}
	const e=doc().querySelector(sel); if(!e) throw new Error('bulunamadı: '+sel); return e;
}
function rect(sel){const r=el(sel).getBoundingClientRect();return {x:r.left,y:r.top,w:r.width,h:r.height};}
async function scrollTo(sel,pos){
	const w=win(), r=el(sel).getBoundingClientRect(); const target=Math.max(0,w.scrollY+r.top-(pos==null?250:pos));
	const start=w.scrollY, d=target-start; if(Math.abs(d)<4) return; const n=Math.min(40,Math.max(14,Math.abs(d)/22));
	for(let i=1;i<=n;i++){w.scrollTo(0,start+d*ease(i/n)); await wait(16);} await wait(120);
}
async function scrollBy(dy){const w=win(),s=w.scrollY;for(let i=1;i<=24;i++){w.scrollTo(0,s+dy*ease(i/24));await wait(16);}await wait(150);}
async function visible(sel){const r=el(sel).getBoundingClientRect(); if(r.top<70||r.bottom>570){await scrollTo(sel,Math.max(90,Math.min(300,330-r.height/2)));}}
async function move(sel,ox,oy,dur){
	await visible(sel); const r=rect(sel); const tx=r.x+(ox==null?r.w/2:ox), ty=r.y+(oy==null?r.h/2:oy);
	C.style.opacity=1; const sx=cx, sy=cy, n=Math.max(12,Math.round((dur||650)/16));
	for(let i=1;i<=n;i++){const k=ease(i/n);cx=sx+(tx-sx)*k;cy=sy+(ty-sy)*k;C.style.left=(cx-4)+'px';C.style.top=(cy-2)+'px';await wait(16);}
}
async function ring(sel,pad){await visible(sel); const r=rect(sel),p=pad==null?6:pad; if(R.style.opacity!=='1'){R.style.transition='none'; void R.offsetWidth; setTimeout(()=>{R.style.transition='';},30);}R.style.left=(r.x-p)+'px';R.style.top=(r.y-p)+'px';R.style.width=(r.w+2*p)+'px';R.style.height=(r.h+2*p)+'px';R.style.opacity=1;R.classList.add('pulse');}
function unring(){R.style.opacity=0;R.classList.remove('pulse');}
async function click(sel,act){
	await move(sel); const d=document.createElement('div'); d.className='ripple'; d.style.left=cx+'px'; d.style.top=cy+'px'; document.body.appendChild(d); setTimeout(()=>d.remove(),700);
	C.style.transform='scale(.85)'; await wait(120); C.style.transform='';
	if(act){const e=el(sel); if(e.tagName==='SUMMARY'){e.parentElement.open=!e.parentElement.open;} else if(e.type==='checkbox'){e.checked=!e.checked;} else if(e.tagName==='SELECT'){} else {e.focus&&e.focus();}}
	await wait(200);
}
async function type(sel,text,cps){
	const e=el(sel); e.focus(); e.value=''; e.dispatchEvent(new Event('input'));
	for(const ch of text){e.value+=ch; await wait(1000/(cps||16));}
	e.dispatchEvent(new Event('change')); await wait(250);
}
function select(sel,textPart){const e=el(sel); for(const o of e.options){if(o.text.trim()===textPart||o.text.includes(textPart)){e.value=o.value;e.dispatchEvent(new Event('change'));return o.text;}} throw new Error('seçenek yok: '+textPart);}
function setv(sel,v){el(sel).value=v;}
async function say(text,step){
	CAP.querySelector('.s').textContent=step||''; const t=CAP.querySelector('.t'); t.textContent=''; CAP.classList.add('on');
	for(const ch of text){t.textContent+=ch; await wait(18);}
}
function hideSay(){CAP.classList.remove('on');}
async function go(url,scroll){
	$('#fade').style.opacity=1; await wait(260);
	await new Promise(res=>{F.onload=res; F.src=url;});
	const st=doc().createElement('style'); st.textContent='html{scrollbar-width:none}::-webkit-scrollbar{display:none}*{caret-color:#ff7a00}'; doc().head.appendChild(st);
	// tarayıcının kendi (İngilizce) dosya seçicisi yerine Türkçe görünüm
	doc().querySelectorAll('input[type=file]').forEach((f,i)=>{f.style.cssText='position:absolute;opacity:0;width:1px;height:1px;pointer-events:none';
		f.insertAdjacentHTML('afterend','<span class="fakefile" id="ff'+i+'" style="display:inline-flex;gap:10px;align-items:center;padding:6px 8px;border:1px solid #d5dbe5;border-radius:10px;background:#fff;font:14px inherit;color:#334;min-width:360px"><b style="padding:6px 12px;border-radius:8px;background:#eef2f7;font-weight:600;color:#0b2545">Dosya Seç</b><i style="font-style:normal;color:#667">Dosya seçilmedi</i></span>');});
	if(scroll) win().scrollTo(0,scroll);
	await wait(150); $('#fade').style.opacity=0; await wait(280);
}
function pick(sel,names){const i=el(sel).querySelector('i'); i.textContent=names; i.style.color='#0b2545'; i.style.fontWeight='600';}
function inject(sel,html,where){el(sel).insertAdjacentHTML(where||'afterend',html);}
async function title(big,sub){$('#title .big').textContent=big;$('#title .sub').textContent=sub||'';$('#title').classList.add('on');$('#chip span').textContent=big;}
async function untitle(){$('#title').classList.remove('on');$('#chip').classList.add('on');await wait(450);}
async function end(big,sub){hideSay();unring();C.style.opacity=0;$('#chip').classList.remove('on');$('#end .big').textContent=big;$('#end .sub').textContent=sub||'';$('#end').classList.add('on');}
function hideCursor(){C.style.opacity=0;}
window.S={pick,visible,el,rect,scrollTo,scrollBy,move,ring,unring,click,type,select,setv,say,hideSay,go,inject,title,untitle,end,wait,hideCursor};
})();
</script>
</body></html>
